    <meta charset="UTF-8" />
    <script>
      // Suppress benign Vite HMR WebSocket closed error in iframe / Cloud Run proxy
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          (event.reason.message && event.reason.message.indexOf('WebSocket') !== -1) ||
          (event.reason.stack && event.reason.stack.indexOf('@vite/client') !== -1)
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (
          (event.message && event.message.indexOf('WebSocket') !== -1) ||
          (event.filename && event.filename.indexOf('@vite/client') !== -1)
        )) {
          event.preventDefault();
        }
      });
    </script>
