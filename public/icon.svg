<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526"/>
      <stop offset="50%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0f3868"/>
    </linearGradient>

    <linearGradient id="icon-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="icon-book-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="icon-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="icon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#icon-bg)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Centered Emblem -->
  <g transform="translate(56, 40) scale(0.5)">
    <!-- Circuit Trace Lines Left -->
    <path d="M 120 240 L 250 240" fill="none" stroke="url(#icon-cyan)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="120" cy="240" r="18" fill="#071526" stroke="url(#icon-cyan)" stroke-width="8"/>

    <path d="M 100 300 L 235 300" fill="none" stroke="url(#icon-gold)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="100" cy="300" r="18" fill="#071526" stroke="url(#icon-gold)" stroke-width="8"/>

    <path d="M 120 360 L 250 360" fill="none" stroke="url(#icon-cyan)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="120" cy="360" r="18" fill="#071526" stroke="url(#icon-cyan)" stroke-width="8"/>

    <!-- Circuit Trace Lines Right -->
    <path d="M 680 240 L 550 240" fill="none" stroke="url(#icon-cyan)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="680" cy="240" r="18" fill="#071526" stroke="url(#icon-cyan)" stroke-width="8"/>

    <path d="M 700 300 L 565 300" fill="none" stroke="url(#icon-gold)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="700" cy="300" r="18" fill="#071526" stroke="url(#icon-gold)" stroke-width="8"/>

    <path d="M 680 360 L 550 360" fill="none" stroke="url(#icon-cyan)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="680" cy="360" r="18" fill="#071526" stroke="url(#icon-cyan)" stroke-width="8"/>

    <!-- Gear Body -->
    <g fill="#0c2340" stroke="#38bdf8" stroke-width="4">
      <circle cx="400" cy="300" r="140"/>
      <rect x="376" y="140" width="48" height="40" rx="6"/>
      <rect x="376" y="420" width="48" height="40" rx="6"/>
      <rect x="240" y="276" width="40" height="48" rx="6"/>
      <rect x="520" y="276" width="40" height="48" rx="6"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(30 400 300)"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(60 400 300)"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(120 400 300)"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(150 400 300)"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(210 400 300)"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(240 400 300)"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(300 400 300)"/>
      <rect x="376" y="140" width="48" height="40" rx="6" transform="rotate(330 400 300)"/>
    </g>

    <circle cx="400" cy="300" r="92" fill="#ffffff"/>

    <!-- Integrated Circuit -->
    <rect x="355" y="255" width="90" height="90" rx="14" fill="#ffffff" stroke="#0a2540" stroke-width="12"/>
    <rect x="375" y="275" width="50" height="50" rx="8" fill="#0a2540"/>

    <!-- Pins -->
    <circle cx="378" cy="235" r="7" fill="#0a2540"/>
    <circle cx="422" cy="235" r="7" fill="#0a2540"/>
    <circle cx="378" cy="365" r="7" fill="#0a2540"/>
    <circle cx="422" cy="365" r="7" fill="#0a2540"/>
    <circle cx="335" cy="278" r="7" fill="#0a2540"/>
    <circle cx="335" cy="322" r="7" fill="#0a2540"/>
    <circle cx="465" cy="278" r="7" fill="#0a2540"/>
    <circle cx="465" cy="322" r="7" fill="#0a2540"/>

    <!-- Graduation Cap -->
    <path d="M 280 145 C 280 205, 520 205, 520 145 Z" fill="#071526" stroke="#38bdf8" stroke-width="4"/>
    <polygon points="400,50 690,140 400,210 110,140" fill="#0b294f" stroke="#38bdf8" stroke-width="6"/>
    <ellipse cx="400" cy="133" rx="16" ry="10" fill="#38bdf8"/>
    <!-- Tassel -->
    <path d="M 400 133 Q 580 140 590 200 L 590 250" fill="none" stroke="url(#icon-cyan)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="590" cy="255" r="10" fill="url(#icon-cyan)"/>

    <!-- Open Book -->
    <path d="M 90 480 C 230 410, 370 460, 400 515 C 430 460, 570 410, 710 480 C 660 520, 470 490, 400 550 C 330 490, 140 520, 90 480 Z" fill="#0a2540" stroke="#38bdf8" stroke-width="4"/>
    <path d="M 110 440 C 240 380, 360 420, 400 480 C 440 420, 560 380, 690 440 C 630 480, 480 445, 400 510 C 320 445, 170 480, 110 440 Z" fill="url(#icon-book-top)"/>
  </g>
</svg>
